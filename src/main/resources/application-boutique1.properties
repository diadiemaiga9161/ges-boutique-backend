# ====================================
# APPLICATION - BOUTIQUE 1
# ====================================
spring.application.name=boutique-1

# ====================================
# SERVER
# ====================================
server.port=8080
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.forward-headers-strategy=framework

# ====================================
# MYSQL DATABASE - VPS
# ====================================
spring.datasource.url=jdbc:mysql://localhost:3306/alimentation?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=${DB_USERNAME:boutique_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ====================================
# HIKARI CONNECTION POOL
# ====================================
spring.datasource.hikari.pool-name=Boutique1HikariPool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ====================================
# JPA / HIBERNATE
# ====================================
spring.jpa.hibernate.ddl-auto=update

# Migrations automatiques (db/migration/V*.sql) — plus besoin de taper de SQL a la
# main sur cette boutique : baseline a V104 (deja applique partout via ddl-auto,
# qui gere les colonnes mais jamais les contraintes existantes) ; a partir de V105,
# chaque nouveau script est execute automatiquement au demarrage.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=104
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Charge les relations par paquets (ventes, lignes, produits, clients...) au lieu d une requete par element.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# ====================================
# JWT CONFIGURATION
# ====================================
jwt.secret=${JWT_SECRET}
# 45 jours : voir commentaire dans application.properties (app mobile offline-first)
jwt.expiration=3888000000
jwt.refresh-expiration=604800000

# ====================================
# LOGGING
# ====================================
logging.level.root=INFO
logging.level.com.ges.boutique=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.file.name=logs/boutique-1.log

# ====================================
# FILE UPLOAD
# ====================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ====================================
# ANGULAR STATIC FILES
# ====================================
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# ====================================
# SWAGGER
# ====================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ====================================
# PATH MATCHING
# ====================================
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

# ====================================
# TIMEZONE / JSON
# ====================================
spring.jackson.time-zone=Africa/Abidjan
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false

# ====================================
# MAIL SMTP (mg-consulting.site)
# ====================================
spring.mail.host=mail.mg-consulting.site
spring.mail.port=587
spring.mail.username=maigaamadou@mg-consulting.site
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=maigaamadou@mg-consulting.site
app.mail.from-name=MG Boutique
app.base-url=https://fatmazahara.mg-consulting.site

# ====================================
# CORS
# ====================================
cors.allowed-origins=http://localhost:4200,http://localhost:8081,http://localhost:8100,http://192.168.2.223:8081,http://192.168.2.223:8100,http://213.156.134.139,http://213.156.134.139:80,http://213.156.134.139:8080,https://fatmazahara.mg-consulting.site,https://localhost,capacitor://localhost
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With
cors.allow-credentials=true


# ====================================
# ANTHROPIC AI
# ====================================
# anthropic.api.key=CONFIGURER_VIA_VARIABLE_ENVIRONNEMENT (ANTHROPIC_API_KEY)

# ====================================
# SECURITE INTER-BOUTIQUES
# ====================================
transfert.service.key=${INTER_BOUTIQUE_SECRET}

# Compression des reponses (donnees et fichiers du site jusqu a 30 fois plus legers)
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/javascript,text/html,text/css,text/plain,text/xml,application/xml,image/svg+xml
server.compression.min-response-size=1024
