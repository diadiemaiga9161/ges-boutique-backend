# ====================================
# APPLICATION - BOUTIQUE LOCALE (PC Windows, hors VPS)
# ====================================
# Jar autonome pour faire tourner l'appli sur ce PC, sans toucher aux
# boutiques 1 a 6 (VPS). Contrairement au profil Spring "local" (active
# via --spring.profiles.active=local), ce fichier remplace entierement
# application.properties au moment du build (meme mecanisme que les
# boutiques 1 a 6 dans build-5-boutiques.bat) : le jar genere se lance
# tel quel, sans aucune option en plus.
#
# Prerequis sur ce PC : MySQL local demarre (root sans mot de passe,
# comme pour front-edumanager). La base "alimentation_local" se cree
# toute seule au premier demarrage (createDatabaseIfNotExist=true).

spring.application.name=boutique-local

# ====================================
# SERVER
# ====================================
server.port=8480
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.forward-headers-strategy=framework

# ====================================
# COMPRESSION GZIP
# ====================================
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/html,text/css,text/xml,application/xml
server.compression.min-response-size=1024

# ====================================
# MYSQL DATABASE - LOCAL (ce PC uniquement)
# ====================================
spring.datasource.url=jdbc:mysql://localhost:3306/alimentation_local?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ====================================
# HIKARI CONNECTION POOL
# ====================================
spring.datasource.hikari.pool-name=BoutiqueLocalHikariPool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ====================================
# JPA / HIBERNATE
# ====================================
spring.jpa.hibernate.ddl-auto=update

# Migrations automatiques (db/migration/V*.sql) — meme mecanisme que les boutiques
# VPS : baseline a V104 (deja applique via ddl-auto), V105 (vendeur_id nullable pour
# les commandes vitrine) applique tout seul au prochain demarrage de ce jar local.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=104
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Charge les relations par paquets (ventes, lignes, produits, clients...) au lieu d une requete par element.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# ====================================
# JWT CONFIGURATION (valeur de dev fixe, jamais utilisee en production)
# ====================================
jwt.secret=LocalDevOnlyJWTSecretNotForProduction2026
jwt.expiration=3888000000
jwt.refresh-expiration=604800000

# ====================================
# LOGGING
# ====================================
logging.level.root=INFO
logging.level.com.ges.boutique=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.file.name=logs/boutique-local.log

# ====================================
# FILE UPLOAD
# ====================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ====================================
# ANGULAR STATIC FILES
# ====================================
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# ====================================
# SWAGGER
# ====================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ====================================
# PATH MATCHING
# ====================================
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

# ====================================
# TIMEZONE / JSON
# ====================================
spring.jackson.time-zone=Africa/Abidjan
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false

# ====================================
# MAIL SMTP (desactive en local : pas de mot de passe reel disponible)
# ====================================
spring.mail.host=mail.mg-consulting.site
spring.mail.port=587
spring.mail.username=maigaamadou@mg-consulting.site
spring.mail.password=local-dev-unused
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=maigaamadou@mg-consulting.site
app.mail.from-name=MG Boutique
app.base-url=http://localhost:8080

# ====================================
# CORS (autorise aussi les serveurs de dev Angular/Ionic locaux)
# ====================================
cors.allowed-origins=http://localhost:4200,http://localhost:4300,http://localhost:8081,http://localhost:8100,https://localhost,capacitor://localhost
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With
cors.allow-credentials=true

# ====================================
# ANTHROPIC AI
# ====================================
# anthropic.api.key=CONFIGURER_VIA_VARIABLE_ENVIRONNEMENT (ANTHROPIC_API_KEY)

# ====================================
# SECURITE INTER-BOUTIQUES (valeur de dev fixe)
# ====================================
transfert.service.key=LocalDevOnlyInterBoutiqueKey2026
